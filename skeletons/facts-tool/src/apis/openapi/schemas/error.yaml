type: object
required: [error]
additionalProperties: false
properties:
  error:
    oneOf:
      - type: string
      - type: object
        required: [code, message]
        additionalProperties: false
        properties:
          code: {type: string}
          message: {type: string}
          details:
            type: object
            description: Optional structured error context.
            additionalProperties: true
    description: Human-readable rejection or failure reason.
examples:
  - error: Unknown job

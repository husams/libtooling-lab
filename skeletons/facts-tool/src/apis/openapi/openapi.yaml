openapi: 3.1.0
info:
  title: facts-tool REST API
  version: 2.0.0
  description: |
    Resource API for indexed C++ symbols and asynchronous source analysis.
    Clients identify symbols by qualified name and source files by path, with
    optional repository, clone and component selectors. The server owns all
    project and facts database paths. Extraction and matching refresh a global
    symbol index asynchronously after responding to the client. Startup scans
    existing facts databases in a background task; inspect /v1/index for state.
    Legacy CLI job endpoints remain available but are deprecated.
    Token-configured servers require Bearer authentication on every endpoint,
    including health and schema documents. The served document reflects that
    setting. Without a token, the Host header must match the local listener
    address or localhost (with its optional configured port). Requests carrying
    Origin or Sec-Fetch-Site are rejected. Use a native client or download this
    contract for Swagger tooling; browser calls to the server are unsupported.
servers:
  - url: /
tags:
  - name: discovery
    description: Health, command catalog, and machine-readable API contracts.
  - name: symbols
    description: Search the persistent index across repositories and files.
  - name: analysis
    description: Analyze registered source files through asynchronous jobs.
  - name: jobs
    description: Poll asynchronous operations and request cancellation.
  - name: server
    description: Inspect database-driven filesystem monitoring and stop the server.
x-facts-limits:
  maxBodyBytes: 1048576
  maxHeaderBytes: 16384
  maxArguments: 4096
  maxArgumentBytes: 65536
paths:
  /v1/symbols:
    $ref: paths/symbols.yaml
  /v1/index:
    $ref: paths/index.yaml
  /v1/extractions:
    $ref: paths/extractions.yaml
  /v1/matches:
    $ref: paths/matches.yaml
  /v1/dependencies:
    $ref: paths/dependencies.yaml
  /health:
    $ref: paths/health.yaml
  /openapi.json:
    $ref: paths/openapi-json.yaml
  /openapi.yaml:
    $ref: paths/openapi-yaml.yaml
  /v1/commands:
    $ref: paths/commands.yaml
  /v1/commands/{commandPath}:
    $ref: paths/command.yaml
  /v1/jobs:
    $ref: paths/jobs.yaml
  /v1/jobs/{id}:
    $ref: paths/job.yaml
  /v1/watch:
    $ref: paths/watch.yaml
  /v1/shutdown:
    $ref: paths/shutdown.yaml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Required for all requests when server.token is configured.
  schemas:
    Argument: {$ref: schemas/argument.yaml}
    Arguments: {$ref: schemas/arguments.yaml}
    JobRequest: {$ref: schemas/job-request.yaml}
    Job: {$ref: schemas/job.yaml}
    Jobs: {$ref: schemas/jobs.yaml}
    Health: {$ref: schemas/health.yaml}
    Shutdown: {$ref: schemas/shutdown.yaml}
    Command: {$ref: schemas/command.yaml}
    CommandCatalog: {$ref: schemas/command-catalog.yaml}
    WatchStatus: {$ref: schemas/watch-status.yaml}
    WatchClone: {$ref: schemas/watch-clone.yaml}
    Error: {$ref: schemas/error.yaml}
    FileSelector: {$ref: schemas/file-selector.yaml}
    ExtractionRequest: {$ref: schemas/extraction-request.yaml}
    FileRequest: {$ref: schemas/file-request.yaml}
    MatchRequest: {$ref: schemas/match-request.yaml}
    Symbol: {$ref: schemas/symbol.yaml}
    SymbolPage: {$ref: schemas/symbol-page.yaml}
    IndexStatus: {$ref: schemas/index-status.yaml}
    DomainJob: {$ref: schemas/domain-job.yaml}
    JobSnapshot: {$ref: schemas/job-snapshot.yaml}
  responses:
    Error:
      $ref: responses/error.yaml
    AcceptedJob:
      $ref: responses/accepted-job.yaml
    AcceptedDomainJob:
      $ref: responses/accepted-domain-job.yaml

openapi: 3.1.0
info:
  title: facts-tool REST API
  version: 2.0.0
  description: 'Typed resource API for C++ analysis. Version and resource IDs are
    in URLs.

    GET reads resources and collections; POST creates resources or jobs; PATCH updates

    selected fields; PUT replaces configuration; DELETE unregisters resources or

    cancels jobs. GET and DELETE never require JSON request bodies. Repository clone

    registrations and active_clone_id are updated on repositories. Compilation

    commands are updated on files. The server owns all catalog, facts and cache paths.

    Symbol searches use literal case-sensitive prefix matching by default; match=exact

    selects equality. Each asynchronous operation has its own request and result schema.

    Legacy /v1 endpoints remain compatible and are not the recommended client API.

    Token-configured servers require Bearer authentication on all endpoints. Browser

    origin requests are rejected; use native or Python clients.'
servers:
- url: /
tags:
- name: discovery
  description: Health, command catalog, and machine-readable API contracts.
- name: symbols
  description: Search the persistent index across repositories and files.
- name: analysis
  description: Analyze registered source files through asynchronous jobs.
- name: jobs
  description: Poll asynchronous operations and request cancellation.
- name: server
  description: Inspect database-driven filesystem monitoring and stop the server.
- name: resources-v2
  description: Typed resource operations. No CLI token wrappers.
x-facts-limits:
  maxBodyBytes: 1048576
  maxHeaderBytes: 16384
  maxArguments: 4096
  maxArgumentBytes: 65536

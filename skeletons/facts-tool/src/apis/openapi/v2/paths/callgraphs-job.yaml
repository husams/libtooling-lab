post:
  operationId: v2CreateCallGraphJob
  tags:
  - resources-v2
  summary: Start callgraphs analysis
  responses:
    '202':
      description: Start callgraphs analysis
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/V2CallGraphJob'
      headers:
        Location:
          description: URL of the created resource or accepted job.
          required: true
          schema:
            type: string
            format: uri-reference
    '400':
      $ref: '../../openapi.yaml#/components/responses/V2Error400'
    '401':
      $ref: '../../openapi.yaml#/components/responses/V2Error401'
    '405':
      $ref: '../../openapi.yaml#/components/responses/V2Error405'
    '415':
      $ref: '../../openapi.yaml#/components/responses/V2Error415'
    '404':
      $ref: '../../openapi.yaml#/components/responses/V2Error404'
    '409':
      $ref: '../../openapi.yaml#/components/responses/V2Error409'
    '422':
      $ref: '../../openapi.yaml#/components/responses/V2Error422'
    '429':
      $ref: '../../openapi.yaml#/components/responses/V2Error429'
    '503':
      $ref: '../../openapi.yaml#/components/responses/V2Error503'
    default:
      $ref: '../../openapi.yaml#/components/responses/V2ErrorDefault'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          oneOf:
          - $ref: '../../openapi.yaml#/components/schemas/V2CallGraphRequest'
          - $ref: '../../openapi.yaml#/components/schemas/V2JobRetryRequest'
get:
  operationId: v2ListCallGraphJobs
  tags:
  - resources-v2
  summary: List callgraphs jobs
  responses:
    '200':
      description: List callgraphs jobs
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/V2CallGraphJobPage'
    '400':
      $ref: '../../openapi.yaml#/components/responses/V2Error400'
    '401':
      $ref: '../../openapi.yaml#/components/responses/V2Error401'
    '405':
      $ref: '../../openapi.yaml#/components/responses/V2Error405'
    '415':
      $ref: '../../openapi.yaml#/components/responses/V2Error415'
    '404':
      $ref: '../../openapi.yaml#/components/responses/V2Error404'
    '409':
      $ref: '../../openapi.yaml#/components/responses/V2Error409'
    '422':
      $ref: '../../openapi.yaml#/components/responses/V2Error422'
    '429':
      $ref: '../../openapi.yaml#/components/responses/V2Error429'
    '503':
      $ref: '../../openapi.yaml#/components/responses/V2Error503'
    default:
      $ref: '../../openapi.yaml#/components/responses/V2ErrorDefault'
  parameters:
  - name: limit
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 500
      default: 50
  - name: cursor
    in: query
    required: false
    schema:
      type: string
      minLength: 1
      maxLength: 4096

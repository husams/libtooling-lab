get:
  operationId: v2ListDirectories
  tags:
  - resources-v2
  summary: List directories
  responses:
    '200':
      description: List directories
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/V2DirectoryPage'
    '400':
      $ref: '../../openapi.yaml#/components/responses/V2Error400'
    '401':
      $ref: '../../openapi.yaml#/components/responses/V2Error401'
    '405':
      $ref: '../../openapi.yaml#/components/responses/V2Error405'
    '415':
      $ref: '../../openapi.yaml#/components/responses/V2Error415'
    '404':
      $ref: '../../openapi.yaml#/components/responses/V2Error404'
    '409':
      $ref: '../../openapi.yaml#/components/responses/V2Error409'
    '422':
      $ref: '../../openapi.yaml#/components/responses/V2Error422'
    '429':
      $ref: '../../openapi.yaml#/components/responses/V2Error429'
    '503':
      $ref: '../../openapi.yaml#/components/responses/V2Error503'
    default:
      $ref: '../../openapi.yaml#/components/responses/V2ErrorDefault'
  parameters:
  - name: limit
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 500
      default: 50
  - name: cursor
    in: query
    required: false
    schema:
      type: string
      minLength: 1
      maxLength: 4096
  - name: repository
    in: query
    required: false
    schema:
      type: string
      minLength: 1
      maxLength: 4096
  - name: component
    in: query
    required: false
    schema:
      type: string
      minLength: 1
      maxLength: 4096

type: object
required:
- files_selected
- files_processed
- files_skipped
- files_failed
- coverage
- edge_count
- index_revision
additionalProperties: false
properties:
  files_not_attempted:
    type: integer
    minimum: 0
  failed_files:
    type: array
    items:
      $ref: '../../openapi.yaml#/components/schemas/V2FileFailure'
  files_selected: &id001
    type: integer
    minimum: 0
  files_processed: *id001
  files_skipped: *id001
  files_failed: *id001
  coverage:
    type: string
    enum:
    - complete
    - partial
  diagnostics:
    type: array
    items:
      $ref: '../../openapi.yaml#/components/schemas/V2Diagnostic'
  edge_count: *id001
  edges:
    type: array
    items:
      $ref: '../../openapi.yaml#/components/schemas/V2DependencyEdge'
  index_revision:
    anyOf:
    - type: string
    - type: 'null'
description: Job reads return scalar summary fields. Record arrays are optional and
  are fetched lazily through the typed results endpoint with the appropriate collection
  query parameter.
  A succeeded job with coverage=partial and files_failed greater than zero completed
  its batch with per-file errors. If every selected file fails, the job is failed.
  Failed and cancelled jobs may retain partial results.

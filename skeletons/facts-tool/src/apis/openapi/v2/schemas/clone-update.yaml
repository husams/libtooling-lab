type: object
required:
- path
additionalProperties: false
properties:
  id:
    type: string
    minLength: 1
    maxLength: 4096
    description: Opaque server resource identifier. Do not infer database row numbers.
  label:
    anyOf:
    - type: string
    - type: 'null'
  path:
    type: string
    minLength: 1
    maxLength: 4096
    description: Filesystem path on the server host.

type: object
required:
- coverage
- truncated
- truncation_reason
- node_count
- edge_count
additionalProperties: false
properties:
  coverage:
    type: string
    enum:
    - complete
    - partial
  truncated:
    type: boolean
  truncation_reason:
    anyOf:
    - type: string
    - type: 'null'
  nodes:
    type: array
    items:
      $ref: '../../openapi.yaml#/components/schemas/V2CallGraphNode'
  edges:
    type: array
    items:
      $ref: '../../openapi.yaml#/components/schemas/V2CallGraphEdge'
  paths:
    type: array
    items:
      $ref: '../../openapi.yaml#/components/schemas/V2CallGraphPath'
  frontier:
    type: array
    items:
      $ref: '../../openapi.yaml#/components/schemas/V2CallGraphFrontier'
  diagnostics:
    type: array
    items:
      $ref: '../../openapi.yaml#/components/schemas/V2Diagnostic'
  node_count: &id001
    type: integer
    minimum: 0
  edge_count: *id001
description: Job reads return scalar summary fields. Record arrays are optional and
  are fetched lazily through the typed results endpoint with the appropriate collection
  query parameter.

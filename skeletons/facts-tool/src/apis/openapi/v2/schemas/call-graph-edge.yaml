type: object
required:
- source
- target
- kind
- file_id
- line
- column
- offset
- implicit
- depth
- cycle
- external_boundary
- definition_boundary
additionalProperties: false
properties:
  source: &id001
    type: string
    minLength: 1
    maxLength: 4096
    description: Opaque server resource identifier. Do not infer database row numbers.
  target: *id001
  kind:
    type: string
    enum:
    - call
    - dispatch_call
  file_id: *id001
  line: &id002
    type: integer
    minimum: 0
  column: *id002
  offset: *id002
  implicit:
    type: boolean
  depth: *id002
  cycle:
    type: boolean
  external_boundary:
    type: boolean
  definition_boundary:
    type: boolean

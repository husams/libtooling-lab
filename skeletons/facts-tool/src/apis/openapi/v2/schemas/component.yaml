type: object
required:
- id
- name
- path
- kind
- version
- repository_id
- repository
- file_count
additionalProperties: false
properties:
  id: &id001
    type: string
    minLength: 1
    maxLength: 4096
    description: Opaque server resource identifier. Do not infer database row numbers.
  name:
    type: string
    minLength: 1
    maxLength: 4096
  path:
    type: string
    minLength: 1
    maxLength: 4096
    description: Filesystem path on the server host.
  kind:
    type: string
  version:
    anyOf:
    - type: string
    - type: 'null'
  repository_id:
    anyOf:
    - *id001
    - type: 'null'
  repository:
    anyOf:
    - type: string
    - type: 'null'
  file_count:
    type: integer
    minimum: 0

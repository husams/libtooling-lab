    type: string
    minLength: 1
    maxLength: 4096
    description: Opaque server resource identifier. Do not infer database row numbers.
  qualified_name:
    type: string
  kind:
    type: string
  usr:
    type: string
  repository:
    type: string
  component:
    type: string
  definition:
    anyOf:
    - $ref: '../../openapi.yaml#/components/schemas/V2SymbolLocation'
    - type: 'null'

type: object
required:
- id
- component_id
- component
- path
- file_count
additionalProperties: false
properties:
  id: &id001
    type: string
    minLength: 1
    maxLength: 4096
    description: Opaque server resource identifier. Do not infer database row numbers.
  component_id: *id001
  component:
    type: string
  path:
    type: string
    minLength: 1
    maxLength: 4096
    description: Filesystem path on the server host.
  file_count:
    type: integer
    minimum: 0

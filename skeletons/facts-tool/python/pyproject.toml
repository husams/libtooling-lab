[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "facts-tool-query"
version = "0.3.0"
description = "Python query SDK and optional REST clients for facts-tool"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "facts-tool contributors"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.optional-dependencies]
rest = ["httpx>=0.28,<1"]

[dependency-groups]
dev = [
  "build>=1.2.2",
  "httpx>=0.28,<1",
  "mypy>=1.15",
  "openapi-spec-validator>=0.7,<0.9",
  "pytest>=8.3",
  "pytest-bdd>=8.1",
  "PyYAML>=6,<7",
  "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/facts_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["facts_tool"]
implicit_reexport = true
